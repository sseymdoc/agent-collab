[package]
name = "agent-collab-desktop"
version = "0.2.0-dev.1"
edition = "2021"
publish = false

[lib]
name = "agent_collab_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 不带缺省 feature：rustls + 系统根证书，不引入 native-tls、cookie、压缩、系统代理。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# 系统“另存为”对话框。直接用 rfd，不注册 tauri-plugin-dialog（它会带进 tauri-plugin-fs 和面向页面的对话框命令）。
rfd = "0.17"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
url = "2"

[features]
# 仅候选版验证用：编译进自动化钩子（src/lib.rs 的 automation 模块）。默认关闭。
automation = []
