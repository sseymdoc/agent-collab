[package]
name = "agent-collab-desktop"
version = "0.2.0-dev.1"
edition = "2021"
publish = false

[lib]
name = "agent_collab_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 随包载荷清单的摘要（build.rs）；与运行时同一版本，已在依赖树里。
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 不带缺省 feature：rustls + 系统根证书，不引入 native-tls、cookie、压缩、系统代理。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# 系统对话框（另存为、选择文件夹、打开文件）。直接用 rfd，不注册 tauri-plugin-dialog（它会带进 tauri-plugin-fs 和面向页面的对话框命令）。
rfd = "0.17"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
url = "2"
# 系统通知。只用它的 Rust API（`notify` 命令）；capabilities 里不授予它自带的页面权限。
tauri-plugin-notification = "2"
# 以下两项本来就在依赖树里（由 tauri、reqwest 带入）：生成 request_id 与应用 ID；解码 PEM 证书。
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# 桌面更新：Tauri 官方 updater 负责检查、下载、验签与安装（只用 Rust API，页面经 update_* 命令）；
# minisign-verify 已由它带入，用同一把公钥核对随更新发布的产品发行清单（ADR 0004）。
tauri-plugin-updater = "2"
minisign-verify = "0.3"

[features]
# 仅内部测试版用：编译进自动化钩子、对话框替身与助手位置覆盖（见 docs/desktop.md“自动化钩子”）。默认关闭。
automation = []
