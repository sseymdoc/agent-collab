[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-collab"
version = "0.1.0.dev0"
description = "Claude–Codex collaboration scheduler: controller, node agent, web UI"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
agent-collab = "agent_collab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_collab*"]

[tool.setuptools.package-data]
agent_collab = ["static/**/*"]
